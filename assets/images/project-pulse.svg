<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Pulse wellness app concept cover</title>
  <desc id="desc">A warm coral cover with concentric rings and a stylised mobile app interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e7dd"/>
      <stop offset="0.55" stop-color="#f0bda8"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1620"/>
      <stop offset="1" stop-color="#2c2233"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b8cf7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.22">
    <circle cx="940" cy="300" r="180" stroke-width="1.5"/>
    <circle cx="940" cy="300" r="250" stroke-width="1.5"/>
    <circle cx="940" cy="300" r="320" stroke-width="1.5"/>
    <circle cx="940" cy="300" r="390" stroke-width="1.5"/>
  </g>
  <circle cx="210" cy="760" r="170" fill="#4f46e5" opacity="0.12"/>
  <g transform="translate(720 160)">
    <rect width="300" height="590" rx="44" fill="url(#phone)"/>
    <rect x="12" y="12" width="276" height="566" rx="34" fill="#fbf7f2"/>
    <rect x="108" y="24" width="84" height="20" rx="10" fill="#1a1620"/>
    <text x="34" y="94" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#8a8290" letter-spacing="2">TODAY</text>
    <text x="34" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#1a1620">Good morning</text>
    <circle cx="150" cy="250" r="78" fill="none" stroke="#efe7df" stroke-width="14"/>
    <circle cx="150" cy="250" r="78" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="360 490" transform="rotate(-90 150 250)"/>
    <text x="150" y="245" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#1a1620">72</text>
    <text x="150" y="272" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#8a8290" letter-spacing="2">READINESS</text>
    <rect x="34" y="370" width="232" height="64" rx="16" fill="#f0eae3"/>
    <rect x="34" y="450" width="232" height="64" rx="16" fill="#f0eae3"/>
    <rect x="34" y="530" width="120" height="12" rx="6" fill="#d8d0c8"/>
  </g>
  <g fill="#1a1620">
    <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" letter-spacing="-3">Pulse</text>
    <text x="94" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="6" opacity="0.65">WELLNESS APP</text>
    <text x="94" y="700" font-family="'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="2" opacity="0.6">Research · Product design · Prototype</text>
  </g>
</svg>
