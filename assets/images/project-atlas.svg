<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Atlas design system concept cover</title>
  <desc id="desc">A deep indigo cover with a stylised dashboard interface and the word Atlas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1021"/>
      <stop offset="0.55" stop-color="#1a1d44"/>
      <stop offset="1" stop-color="#34317a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b8cf7"/>
      <stop offset="1" stop-color="#f0a37f"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="1050" cy="110" r="260" fill="#6366f1" opacity="0.22"/>
  <circle cx="120" cy="820" r="220" fill="#f0a37f" opacity="0.12"/>
  <g transform="translate(640 170)">
    <rect width="440" height="560" rx="28" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="32" y="32" width="120" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
    <rect x="32" y="60" width="70" height="8" rx="4" fill="#ffffff" opacity="0.25"/>
    <rect x="32" y="104" width="376" height="130" rx="18" fill="#0d1021" opacity="0.35"/>
    <path d="M54 204c40-12 54-62 92-52s50 38 82 18 54-56 92-40 40 32 66 20" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
    <rect x="32" y="262" width="180" height="112" rx="16" fill="#ffffff" opacity="0.09"/>
    <rect x="228" y="262" width="180" height="112" rx="16" fill="#ffffff" opacity="0.09"/>
    <rect x="54" y="288" width="70" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="54" y="310" width="110" height="16" rx="8" fill="#ffffff" opacity="0.65"/>
    <rect x="250" y="288" width="70" height="8" rx="4" fill="#ffffff" opacity="0.35"/>
    <rect x="250" y="310" width="90" height="16" rx="8" fill="#ffffff" opacity="0.65"/>
    <rect x="32" y="402" width="376" height="12" rx="6" fill="#ffffff" opacity="0.14"/>
    <rect x="32" y="432" width="300" height="12" rx="6" fill="#ffffff" opacity="0.14"/>
    <rect x="32" y="462" width="336" height="12" rx="6" fill="#ffffff" opacity="0.14"/>
    <rect x="32" y="510" width="120" height="34" rx="17" fill="url(#accent)"/>
  </g>
  <g fill="#f7f5ef">
    <text x="90" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="96" letter-spacing="-3">Atlas</text>
    <text x="94" y="352" font-family="'Segoe UI', Arial, sans-serif" font-size="22" letter-spacing="6" opacity="0.7">DESIGN SYSTEM</text>
    <text x="94" y="700" font-family="'Segoe UI', Arial, sans-serif" font-size="20" letter-spacing="2" opacity="0.55">Components · Tokens · Documentation</text>
