<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ashley Miller monogram">
  <rect width="64" height="64" rx="15" fill="#790D16"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13" fill="none" stroke="#FCF0DA" stroke-width="1.2" stroke-opacity="0.3"/>
  
  <!-- Neural graph paths -->
  <line x1="32" y1="14" x2="16.5" y2="49.5" stroke="#FCF0DA" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="32" y1="14" x2="47.5" y2="49.5" stroke="#FCF0DA" stroke-width="3.6" stroke-linecap="round"/>
  <line x1="22" y1="36.5" x2="42" y2="36.5" stroke="#FCF0DA" stroke-width="3.2" stroke-linecap="round"/>
  
  <!-- Data stream -->
  <line x1="32" y1="19" x2="32" y2="33" stroke="#FCF0DA" stroke-width="1.8" stroke-dasharray="2.2 2"/>

  <!-- Nodes -->
  <!-- Apex -->
  <circle cx="32" cy="14" r="4.2" fill="#FCF0DA"/>
  <circle cx="32" cy="14" r="1.8" fill="#790D16"/>

  <!-- Center node -->
  <circle cx="32" cy="36.5" r="3.4" fill="#FCF0DA"/>

  <!-- Bottom left node -->
  <circle cx="16.5" cy="49.5" r="3.8" fill="#FCF0DA"/>
  <circle cx="16.5" cy="49.5" r="1.6" fill="#790D16"/>

  <!-- Bottom right node -->
  <circle cx="47.5" cy="49.5" r="3.8" fill="#FCF0DA"/>
  <circle cx="47.5" cy="49.5" r="1.6" fill="#790D16"/>

  <!-- Active stream telemetry dot -->
  <circle cx="51.5" cy="13.5" r="2.2" fill="#FCF0DA"/>
  <circle cx="51.5" cy="13.5" r="3.8" fill="none" stroke="#FCF0DA" stroke-width="0.8" stroke-opacity="0.35"/>
</svg>
